services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acss-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Mount file database SQLite để lưu dữ liệu lâu dài
      - ./backend/database.db:/app/database.db
    networks:
      - acss-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acss-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - acss-network

networks:
  acss-network:
    driver: bridge
